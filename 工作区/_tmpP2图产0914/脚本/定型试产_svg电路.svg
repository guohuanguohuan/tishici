<?xml version="1.0" encoding="UTF-8"?>
<!-- P2 图产试产臂·工艺定型试产（手绘 SVG 链）——电路图样张（E、S、R、电容 AB） -->
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" viewBox="0 0 560 380">
  <rect width="560" height="380" fill="white"/>
  <g stroke="black" stroke-width="2.4" fill="none">
    <!-- 左侧电池 E：长线(+)上、短线(-)下 -->
    <line x1="60" y1="300" x2="60" y2="212"/>
    <line x1="60" y1="188" x2="60" y2="60"/>
    <line x1="28" y1="188" x2="92" y2="188" stroke-width="2.4"/>
    <line x1="42" y1="212" x2="78" y2="212" stroke-width="5"/>
    <!-- 顶边导线＋开关 S -->
    <line x1="60" y1="60" x2="240" y2="60"/>
    <line x1="330" y1="60" x2="490" y2="60"/>
    <circle cx="240" cy="60" r="4" fill="black"/>
    <circle cx="330" cy="60" r="4" fill="black"/>
    <line x1="240" y1="60" x2="322" y2="22"/>
    <!-- 右侧电容 AB -->
    <line x1="490" y1="60" x2="490" y2="152"/>
    <line x1="490" y1="218" x2="490" y2="300"/>
    <line x1="458" y1="152" x2="522" y2="152" stroke-width="4"/>
    <line x1="458" y1="218" x2="522" y2="218" stroke-width="4"/>
    <!-- 底边导线＋电阻 R（面框式） -->
    <line x1="490" y1="300" x2="370" y2="300"/>
    <line x1="190" y1="300" x2="60" y2="300"/>
    <rect x="190" y="284" width="180" height="32" fill="white"/>
  </g>
  <g font-family="serif" font-style="italic" font-size="26" fill="black">
    <text x="20" y="180">E</text>
    <text x="270" y="20">S</text>
    <text x="536" y="192">A</text>
    <text x="536" y="240">B</text>
    <text x="268" y="352">R</text>
  </g>
</svg>
